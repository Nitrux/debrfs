# Default values for debrfs
# debrfs.conf 2025 (c) Nitrux Latinoamericana S.C.

# Define values for mmdebstrap
#
# See 'man mmdebstrap' for more information
#
ROOTFS_VARIANT=minbase
ROOTFS_INCLUDE=apt-transport-https,axel,ca-certificates,ca-certificates-java,curl,dirmngr,git,gnupg2,less,libzstd-dev,lz4,zstd
ROOTFS_EXCLUDE=systemd-sysv
ROOTFS_ARCH=amd64
ROOTFS_SUITE=stable
ROOTFS_MIRROR=http://deb.debian.org/debian
# Multiple repositories can be comma-separated and must provide ROOTFS_SUITE.
# ROOTFS_MIRROR=https://mirror.example.org/debian,https://packages.example.org/debian

# Optional GPG keyring used to verify the repository Release file. Set either
# ROOTFS_KEYRING to an existing keyring file or ROOTFS_KEYRING_URL to an HTTPS key URL.
# ROOTFS_KEYRING=/usr/share/keyrings/repository-archive-keyring.gpg
# ROOTFS_KEYRING_URL=https://example.org/keys/repository.gpg,https://example.org/keys/extra-repository.gpg
# Optional APT priorities, as comma-separated host:priority entries.
# ROOTFS_REPOSITORY_PRIORITIES=packagecloud.io:600

# Directory where rootfs will be created
# Use absolute path for consistency
#
ROOTFS_DIR=/var/tmp/debrfs-rootfs

# Output directory for final archive
# If not set, archive will be created in parent directory of ROOTFS_DIR
#
# OUTPUT_DIR=/var/tmp/debrfs

# Filename for compressed directory
# Uses timestamp for unique identification
#
TAR_FILE=rootfs

# Compression settings
# Supported tools: xz, gzip, bzip2, zstd
#
COMPRESSION_TOOL=xz
COMPRESSION_LEVEL=9

# Keep rootfs directory after creating archive
# Set to 'true' to preserve, 'false' to cleanup (default)
#
KEEP_ROOTFS=false
